project:
  description: Quarkiverse Deployment
  copyright: Copyright(C) 2024 - Red Hat
  # Required by JReleaser as soon as an announcer is configured
  license: Apache-2.0
  authors:
    - The Quarkiverse Team
  links:
    homepage: https://github.com/{{Env.PAYLOAD_REPOSITORY}}
    documentation: https://docs.quarkiverse.io/{{Env.PAYLOAD_NAME}}/dev/
  languages:
    java:
      groupId: io.quarkiverse

signing:
  active: ALWAYS
  pgp:
    armored: true
    verify: true

deploy:
  maven:
    pomchecker:
      failOnWarning: false
      strict: false
    mavenCentral:
      sonatype:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        retryDelay: 20
        maxRetries: 500
        stagingRepositories:
          - ./repository
    nexus2:
      maven-central:
        active: SNAPSHOT
        url: https://central.sonatype.com/repository/maven-snapshots/
        snapshotUrl: https://central.sonatype.com/repository/maven-snapshots/
        transitionDelay: 20
        transitionMaxRetries: 500
        stagingRepositories:
          - ./repository

announce:
  zulip:
    active: RELEASE
    apiHost: https://quarkusio.zulipchat.com/api/v1
    # The default template points at this repository's release notes and
    # changelog, which are meaningless here: build the links from the payload.
    message: '{{projectName}} {{projectVersion}} has been released! https://github.com/{{Env.PAYLOAD_REPOSITORY}}/releases/tag/{{projectVersion}}'
