name: Deploy Artifacts to Central
run-name: Deploy ${{ github.event.inputs.name }} ${{ github.event.inputs.version }} to Central
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the artifact'
        required: true
      version:
        description: 'Version of the artifact'
        required: true
      github_repository:
        description: 'GitHub repository of the artifact'
        required: true
      run_id:
        description: 'Run ID of the release workflow'
        required: true
      dry_run:
        description: 'Dry run the release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PAYLOAD_NAME: ${{ github.event.inputs.name }}
  PAYLOAD_VERSION: ${{ github.event.inputs.version }}
  PAYLOAD_REPOSITORY: ${{ github.event.inputs.github_repository }}
  PAYLOAD_RUN_ID: ${{ github.event.inputs.run_id }}
  DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN }}

concurrency:
  # Group by repository and version
  group: ${{ github.event.inputs.github_repository }}-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  deploy_to_central:
    environment: central
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        run: |
          echo "ARTIFACT_PATH=${PAYLOAD_NAME}-${PAYLOAD_VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact
          repository: ${{ env.PAYLOAD_REPOSITORY }}
          run-id: ${{ env.PAYLOAD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Artifact Attestation
        run: gh attestation verify --repo ${PAYLOAD_REPOSITORY} ${ARTIFACT_PATH} --signer-repo quarkiverse/.github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Untar the artifacts
        run: |
          mkdir repository
          tar -xzvf $ARTIFACT_PATH -C repository

      - name: Verify structure
        uses: jbangdev/jbang-action@v0.126.3
        with:
          script: validate_repository.java
        env:
          ARTIFACT_DIR: ./repository
          REPOSITORY: ${{ env.PAYLOAD_REPOSITORY }}
          NAME: ${{ env.PAYLOAD_NAME }}
          VERSION: ${{ env.PAYLOAD_VERSION }}

      - name: Deploy to Central
        uses: jreleaser/release-action@v2
        with:
          version: latest
          arguments: 'deploy'
        env:
          JRELEASER_DRY_RUN: ${{ env.DRY_RUN }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_NEXUS2_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_PROJECT_VERSION: ${{ env.PAYLOAD_VERSION }}
          JRELEASER_PROJECT_NAME: ${{ env.PAYLOAD_NAME }}

      # Adds the "What's Changed" section of the extension's GitHub release to
      # the Zulip announcement. Best effort: if anything fails, the notes stay
      # empty and the announcement is the plain one-liner.
      - name: Fetch release notes
        if: ${{ !endsWith(env.PAYLOAD_VERSION, '-SNAPSHOT') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "$PAYLOAD_VERSION" -R "$PAYLOAD_REPOSITORY" --json body --jq .body) || BODY=""
          # Keep "## What's Changed" up to the next "## " heading or "**Full Changelog**" line
          # (whole body if there is no such section), turn "#" headings outside code fences into
          # bold (they render too big in chat), cut at line boundaries to at most 3500 code
          # points, and break Zulip @-mentions such as @**all** with a zero-width space.
          NOTES=$(printf '%s' "$BODY" | sed -E 's/\r//g; s/@(_?\*)/@\xE2\x80\x8B\1/g' | jq -Rrs '
            split("\n") as $l
            | (first(range($l | length) | select($l[.] | test("^## What.s Changed"))) // null) as $s
            | if $s == null then $l
              else $l[$s:] | .[:(first(range(1; length) as $i | select(.[$i] | test("^## |^\\*\\*Full Changelog\\*\\*")) | $i) // length)]
              end
            | reduce .[] as $x ({o: [], f: false};
                (if $x | test("^ {0,3}(```|~~~)") then .f |= not else . end)
                | .o += [if .f then $x else $x | sub("^ {0,3}#{1,6}[ \\t]+(?<t>.*?)(?:[ \\t]+#+)?[ \\t]*$"; "**\(.t)**") end])
            | .o | join("\n") | sub("\\s+\\z"; "")
            | "*… truncated, see the full release notes*" as $m
            | if length <= 3500 then .
              else split("\n")
                | reduce .[] as $x ({k: [], n: -1, cut: false};
                    if .cut or .n + 1 + ($x | length) > 3500 - 2 - ($m | length) then .cut = true
                    else .k += [$x] | .n += 1 + ($x | length) end)
                | (.k | join("\n") | sub("\\s+\\z"; "")) + "\n\n" + $m
              end')
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "RELEASE_NOTES<<${DELIMITER}"
            echo "$NOTES"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"

      # Deliberately not 'full-release': that would also tag and create a
      # GitHub release on *this* repository. Announce is the only extra step
      # we want once the artifacts are on Central.
      - name: Announce Release
        uses: jreleaser/release-action@v2
        with:
          version: latest
          arguments: 'announce'
        env:
          JRELEASER_DRY_RUN: ${{ env.DRY_RUN }}
          # Required even for 'announce': release.github.token is validated
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_PROJECT_VERSION: ${{ env.PAYLOAD_VERSION }}
          JRELEASER_PROJECT_NAME: ${{ env.PAYLOAD_NAME }}
          JRELEASER_ZULIP_ACCOUNT: ${{ secrets.ZULIP_ACCOUNT }}
          JRELEASER_ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      # Persist logs
      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
